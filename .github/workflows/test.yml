name: tests
on: [push]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make the sample folder
        run: python make_sample.py
      - name: Run the tests
        run: python -m unittest -v
      - name: Check the sample search
        shell: bash
        run: |
          python findbyname.py "*.jpg" sample
          python findbyname.py "*.jpg" sample | grep -q "dog.JPG" && echo "Sample name search checked."
